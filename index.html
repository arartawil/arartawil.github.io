<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArarStudio</title>
  <meta name="description" content="ArarStudio — تطبيقات Arar Al Tawil">
  <style>
    :root { --bg: #F4F1EA; --card: #fff; --text: #1A2233; --muted: #5B6475; --accent: #1E4F8F; --line: #E4DED2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.7 system-ui, "Segoe UI", Tahoma, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 4px; font-size: 20px; }
    .card p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--accent); }
    footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
  </style>
</head>
<body>
  <main>
    <h1>ArarStudio</h1>
    <p class="sub">تطبيقات Arar Al Tawil · Apps by Arar Al Tawil</p>

    <section class="card">
      <h2>معدّلي — Moaddali</h2>
      <p>حاسبة معدّل جامعي لطلاب الأردن، بتشتغل بدون إنترنت وبدون تسجيل دخول.<br>
         Offline university GPA calculator for students in Jordan.</p>
      <a href="https://github.com/arartawil/gaems/blob/master/README.md">سياسة الخصوصية · Privacy policy</a>
    </section>

    <footer>
      <a href="mailto:arartawil@gmail.com">arartawil@gmail.com</a> ·
      <a href="http://arartawil.com">arartawil.com</a>
    </footer>
  </main>
</body>
</html>
